# /etc/nginx/sites-available/proxy-router  (symlink into sites-enabled)
# Replace YOUR-SUBDOMAIN. Get the certificate first (sudo certbot certonly --nginx -d YOUR-SUBDOMAIN.duckdns.org);
# see DEPLOY.md, Part 1, step 6.
# The /gootex/ block is only needed if gooTeX shares this server; delete it otherwise.
server {
    listen 80;
    server_name YOUR-SUBDOMAIN.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name YOUR-SUBDOMAIN.duckdns.org;
    ssl_certificate /etc/letsencrypt/live/YOUR-SUBDOMAIN.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR-SUBDOMAIN.duckdns.org/privkey.pem;
    client_max_body_size  64M;

    location /health {
        proxy_pass http://127.0.0.1:8081/health;
        proxy_set_header Host $host;
    }

    # /get_bib has no credential check (it is meant for gooTeX over localhost:8081), so keep it off the public URL.
    location = /bibman/get_bib {
        return 403;
    }

    location /bibman/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
    }

    location /gootex/ {
        proxy_pass         http://127.0.0.1:8082/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout    130s;
        proxy_send_timeout    130s;
        proxy_connect_timeout 10s;
    }

    location = /gootex {
        return 301 https://$host/gootex/;
    }
}
